packages:
  - apps/*
  - packages/*
  - services/*

allowBuilds:
  esbuild: true
  protobufjs: true

overrides:
  "uuid@<11.1.1": 11.1.1

patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch

audit:
  level: moderate
  ignore:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.17"
  - "@expo/fingerprint@0.20.9"
  - "@expo/local-build-cache-provider@57.0.7"
  - "@expo/metro-config@57.0.9"
  - "@expo/metro-runtime@57.0.12"
  - "@expo/prebuild-config@57.0.13"
  - "@expo/router-server@57.0.7"
  - "@expo/ui@57.0.12"
  - expo-asset@57.0.13
  - expo-auth-session@57.0.8
  - expo-camera@57.0.4
  - expo-constants@57.0.13
  - expo-file-system@57.0.5
  - expo-image-manipulator@57.0.12
  - expo-image-picker@57.0.12
  - expo-linking@57.0.7
  - expo-modules-core@57.0.12
  - expo-modules-jsi@57.0.5
  - expo-notifications@57.0.13
  - expo-router@57.0.15
  - expo@57.0.15
